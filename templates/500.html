{% extends 'base.html' %}
{% block title %}500 Server Error | SAMS{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
  <div class="row justify-content-center text-center">
    <div class="col-md-7 col-lg-6">
      <div class="glass-card p-5 mt-4">
        <div class="display-1 fw-bold text-gradient-coral mb-3">500</div>
        <h2 class="h3 fw-bold text-white mb-3">Internal System Error</h2>
        <p class="text-muted-cosmic mb-4">
          {{ message|default:"An unexpected server error occurred while processing your request. Please try again or return to the home page." }}
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'home' %}" class="btn-cosmic-primary"><i class="bi bi-house-door me-1"></i>Back to Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
