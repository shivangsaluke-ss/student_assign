{% extends "base.html" %}

{% block title %}403 Forbidden - Access Denied{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card card-sams p-5 border-0 shadow">
        <div class="mb-4 text-danger">
          <i class="bi bi-shield-slash fs-1" style="font-size: 72px !important; color: var(--c-coral);"></i>
        </div>
        <h1 class="display-font mb-3" style="color: var(--c-coral);">403 - Access Denied</h1>
        <p class="text-muted mb-4 lead">
          {{ message|default:"You do not have permission to view this section with your current account role." }}
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'home' %}" class="btn btn-outline-secondary">Go to Homepage</a>
          <a href="{% url 'login' %}" class="btn btn-sams-primary">Switch Account / Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
